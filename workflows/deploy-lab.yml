name: Deploy Lab to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - 'exp-animation/**'
      - '.github/workflows/deploy-lab.yml'
  workflow_dispatch:

env:
  OSS_BUCKET: ge-3d-wiki
  OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
  OSS_TARGET_PREFIX: demo/lab/
  LAB_DIR: ./exp-animation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      # 1. 全量同步（移除 --exclude "*.html"，让 HTML 正常上传）
      # 注意：这里对非 HTML 资源使用长期缓存
      - name: Sync all files to OSS
        run: |
          ossutil sync \
            "${{ env.LAB_DIR }}/" \
            "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_TARGET_PREFIX }}" \
            --update \
            --delete \
            --acl public-read \
            --meta "Cache-Control:max-age=31536000,immutable"

      # 2. 单独为 HTML 文件设置 no-cache（覆盖上面的长缓存）
      - name: Set HTML no-cache
        run: |
          ossutil ls "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_TARGET_PREFIX }}" --include "*.html" -s | \
          while read file; do
            if [[ "$file" == *.html ]]; then
              echo "Setting no-cache for: $file"
              ossutil set-meta "oss://$file" "Cache-Control:no-cache,no-store,must-revalidate" --update
            fi
          done