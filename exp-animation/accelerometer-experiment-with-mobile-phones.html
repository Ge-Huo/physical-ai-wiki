<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机传感器物理实验</title>
    <!-- 1. 添加CSP配置：放宽限制，允许同域和blob URL创建worker -->
    <meta http-equiv="Content-Security-Policy" content="worker-src 'self' blob:; default-src 'self' https: data: 'unsafe-inline';">
    <!-- 2. 引入Chart.js 2.9.4（不使用Web Workers） -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chart-container { width: 100%; max-width: 600px; margin: 20px auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>手机传感器物理实验</h1>
    <p>请点击下方按钮开始测量，摇晃手机观察加速度变化。</p>
    <button id="startBtn">开始测量</button>
    <div id="chart-container">
        <canvas id="accelerationChart"></canvas>
    </div>
    <script>
        // 获取DOM元素
        const startBtn = document.getElementById('startBtn');
        const canvas = document.getElementById('accelerationChart');
        let chart;
        let isMeasuring = false;

        // 初始化图表
        function initChart() {
            const ctx = canvas.getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'X轴加速度', data: [], borderColor: 'red', fill: false },
                        { label: 'Y轴加速度', data: [], borderColor: 'green', fill: false },
                        { label: 'Z轴加速度', data: [], borderColor: 'blue', fill: false },
                        { label: '合加速度', data: [], borderColor: 'black', fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { title: { display: true, text: '时间 (s)' } },
                        y: { title: { display: true, text: '加速度 (m/s²)' }, min: -15, max: 15 }
                    }
                }
            });
        }

        // 开始测量
        startBtn.addEventListener('click', () => {
            if (isMeasuring) {
                stopMeasuring();
                startBtn.textContent = '开始测量';
            } else {
                startMeasuring();
                startBtn.textContent = '停止测量';
            }
        });

        // 开始测量函数
        function startMeasuring() {
            isMeasuring = true;
            chart.data.labels = [];
            chart.data.datasets.forEach(dataset => dataset.data = []);
            chart.update();

            // 监听设备运动事件
            window.addEventListener('devicemotion', handleMotion);
        }

        // 停止测量函数
        function stopMeasuring() {
            isMeasuring = false;
            window.removeEventListener('devicemotion', handleMotion);
        }

        // 处理设备运动数据
        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            const x = acc.x || 0;
            const y = acc.y || 0;
            const z = acc.z || 0;
            const total = Math.sqrt(x*x + y*y + z*z);

            // 获取当前时间（秒）
            const now = new Date();
            const time = now.getSeconds() + now.getMilliseconds() / 1000;

            // 添加数据到图表
            chart.data.labels.push(time.toFixed(2));
            chart.data.datasets[0].data.push(x);
            chart.data.datasets[1].data.push(y);
            chart.data.datasets[2].data.push(z);
            chart.data.datasets[3].data.push(total);

            // 限制数据点数量（保持图表清晰）
            const maxDataPoints = 50;
            if (chart.data.labels.length > maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            chart.update();
        }

        // 初始化图表
        initChart();
    </script>
</body>
</html>
