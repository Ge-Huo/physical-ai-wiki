<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D视差照片体验</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* 3D 容器：定义透视距离 */
        .scene {
            width: 90vw;
            height: 70vh;
            perspective: 800px; /* 关键属性：值越小，3D立体感越强 */
        }
        
        /* 照片卡片：保持3D空间结构 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* 关键属性：让子元素保留在3D空间中 */
            transition: transform 0.1s ease-out;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
        
        /* 上传按钮样式 */
        input[type="file"] { display: none; }
        .upload-btn {
            position: absolute; top: 20px; right: 20px;
            padding: 8px 15px; background: #fff; color: #000;
            border-radius: 20px; font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>

    <label for="fileInput" class="upload-btn">📷 换一张照片</label>
    <input type="file" id="fileInput" accept="image/*">

    <div class="scene">
        <div class="card" id="card3d">
            <!-- 默认展示一张占位图，你可以替换成你自己的测试图 -->
            <img src="https://picsum.photos/800/600?random=1" alt="3D Photo" id="photo">
        </div>
        <div class="hint">📱 倾斜手机或滑动屏幕查看3D效果</div>
    </div>

<script>
    const card = document.getElementById('card3d');
    const fileInput = document.getElementById('fileInput');
    const photo = document.getElementById('photo');

    // 1. 处理照片上传
    fileInput.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                photo.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // 2. 核心：绑定陀螺仪数据 (DeviceOrientation)
    function initGyro() {
        window.addEventListener('deviceorientation', (event) => {
            // beta: 前后倾斜 (-180~180), gamma: 左右倾斜 (-90~90)
            let beta = event.beta ? event.beta / 3 : 0; 
            let gamma = event.gamma ? event.gamma / 3 : 0;
            
            // 限制最大旋转角度，防止画面翻转
            beta = Math.max(-20, Math.min(20, beta));
            gamma = Math.max(-20, Math.min(20, gamma));

            // 应用CSS3 3D变换：注意 rotateX 和 rotateY 的方向是相反的
            card.style.transform = `rotateX(${-beta}deg) rotateY(${gamma}deg)`;
        });
    }

    // 3. 兼容电脑端：鼠标移动模拟3D效果
    document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // 4. 请求陀螺仪权限 (iOS 13+ 必须)
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.body.addEventListener('click', () => {
            DeviceOrientationEvent.requestPermission().then(response => {
                if (response === 'granted') initGyro();
            }).catch(console.error);
        }, { once: true });
    } else {
        initGyro();
    }
</script>
</body>
</html>
