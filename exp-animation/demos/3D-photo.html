<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D活照片 - 精简版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            text-shadow: 0 2px 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            padding: 0 16px;
            width: 100%;
        }
        #info h1 { 
            font-weight: 600; 
            letter-spacing: 2px; 
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #info p { 
            opacity: 0.6; 
            font-size: clamp(0.7rem, 1.4vw, 0.95rem);
            color: rgba(255,255,255,0.8);
            -webkit-text-fill-color: rgba(255,255,255,0.8);
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #4ecdc4;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
            transition: all 0.3s;
            font-weight: 500;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
        }
        #status.error { color: #ff6b6b; }
        #status.warning { color: #ffd93d; }
        #status.success { color: #4ecdc4; }

        #upload-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #upload-btn:hover, #upload-btn:active {
            background: rgba(255,255,255,0.16);
            transform: translateX(-50%) scale(1.02);
        }
        #upload-btn input[type="file"] {
            display: none;
        }
        #upload-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .hint {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }
        @media (max-width: 480px) {
            #upload-btn { bottom: 70px; padding: 10px 18px; font-size: 0.8rem; }
            #status { bottom: 20px; font-size: 0.6rem; padding: 6px 14px; }
            .hint { bottom: 120px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>✨ 3D 活照片</h1>
        <p>上传照片 → 点击画面 → 鼠标/手指拖动</p>
    </div>

    <div id="status">📸 上传照片后点击拖动查看3D效果</div>

    <div id="canvas-container"></div>

    <div class="hint">🖱️ 在画面上拖动鼠标或手指</div>

    <button id="upload-btn">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        上传照片
        <input type="file" id="file-input" accept="image/*" />
    </button>

    <!-- 只依赖 Three.js，不依赖 MediaPipe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <script>
    (function() {
        'use strict';

        // ================================================================
        //  配置
        // ================================================================
        const CONFIG = {
            parallaxStrength: 0.04,
            smoothFactor: 0.1,
            rotationSpeed: 0.005,
        };

        // ================================================================
        //  DOM 引用
        // ================================================================
        const containerEl = document.getElementById('canvas-container');
        const statusEl = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');

        // ================================================================
        //  状态
        // ================================================================
        let scene, camera, renderer;
        let portraitMesh = null;
        let backgroundMesh = null;
        let particlesMesh = null;
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let autoRotate = true;

        // ================================================================
        //  场景初始化
        // ================================================================
        function initScene() {
            const width = containerEl.clientWidth || window.innerWidth;
            const height = containerEl.clientHeight || window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
            camera.position.z = 5.5;

            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: false,
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            containerEl.appendChild(renderer.domElement);

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(2, 3, 4);
            scene.add(dirLight);

            createDefaultLayers();
            createParticles();

            // 鼠标/触摸交互
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mousemove', onDragMove);
            canvas.addEventListener('mouseup', onDragEnd);
            canvas.addEventListener('mouseleave', onDragEnd);
            canvas.addEventListener('touchstart', onTouchStart, { passive: true });
            canvas.addEventListener('touchmove', onTouchMove, { passive: true });
            canvas.addEventListener('touchend', onTouchEnd, { passive: true });

            window.addEventListener('resize', onResize);
        }

        // ----- 创建默认图层 -----
        function createDefaultLayers() {
            // 背景层
            const bgCanvas = document.createElement('canvas');
            bgCanvas.width = 1024;
            bgCanvas.height = 768;
            const ctx = bgCanvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, bgCanvas.width, bgCanvas.height);
            grad.addColorStop(0, '#1a1a3e');
            grad.addColorStop(0.5, '#2d2d6e');
            grad.addColorStop(1, '#4a3a6a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = 0; i < 8; i++) {
                const x = Math.random() * bgCanvas.width;
                const y = Math.random() * bgCanvas.height;
                const r = 80 + Math.random() * 180;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, `rgba(255,255,255,${0.02 + Math.random() * 0.04})`);
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.font = 'bold 44px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🌌 背景层', bgCanvas.width/2, bgCanvas.height/2 - 20);

            const bgTex = new THREE.CanvasTexture(bgCanvas);
            const bgMat = new THREE.MeshStandardMaterial({ map: bgTex, roughness: 0.3, metalness: 0.1 });
            const bgGeo = new THREE.PlaneGeometry(7.5, 5.6);
            backgroundMesh = new THREE.Mesh(bgGeo, bgMat);
            backgroundMesh.position.z = -1.8;
            scene.add(backgroundMesh);

            // 人物层 - 默认显示
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 1024;
            pCanvas.height = 768;
            const pc = pCanvas.getContext('2d');
            
            // 身体
            const bodyGrad = pc.createLinearGradient(300, 400, 700, 600);
            bodyGrad.addColorStop(0, '#6c5ce7');
            bodyGrad.addColorStop(1, '#a29bfe');
            pc.fillStyle = bodyGrad;
            pc.beginPath();
            pc.ellipse(512, 470, 180, 220, 0, 0, Math.PI * 2);
            pc.fill();

            // 头
            const headGrad = pc.createRadialGradient(460, 220, 30, 512, 250, 130);
            headGrad.addColorStop(0, '#ffd93d');
            headGrad.addColorStop(1, '#f6b93b');
            pc.fillStyle = headGrad;
            pc.beginPath();
            pc.arc(512, 250, 120, 0, Math.PI * 2);
            pc.fill();

            // 眼睛
            pc.fillStyle = '#2d2d3a';
            pc.beginPath();
            pc.arc(455, 230, 16, 0, Math.PI * 2);
            pc.fill();
            pc.beginPath();
            pc.arc(569, 230, 16, 0, Math.PI * 2);
            pc.fill();
            pc.fillStyle = 'white';
            pc.beginPath();
            pc.arc(462, 224, 5, 0, Math.PI * 2);
            pc.fill();
            pc.beginPath();
            pc.arc(576, 224, 5, 0, Math.PI * 2);
            pc.fill();

            // 微笑
            pc.strokeStyle = '#2d2d3a';
            pc.lineWidth = 4;
            pc.beginPath();
            pc.arc(512, 270, 40, 0.15 * Math.PI, 0.85 * Math.PI);
            pc.stroke();

            pc.fillStyle = 'rgba(255,255,255,0.4)';
            pc.font = 'bold 32px Arial';
            pc.textAlign = 'center';
            pc.fillText('🧑 人物层', 512, 720);

            const pTex = new THREE.CanvasTexture(pCanvas);
            const pMat = new THREE.MeshStandardMaterial({ 
                map: pTex, 
                transparent: true,
                roughness: 0.4,
                metalness: 0.05,
            });
            const pGeo = new THREE.PlaneGeometry(4.8, 3.6);
            portraitMesh = new THREE.Mesh(pGeo, pMat);
            portraitMesh.position.z = 0.6;
            scene.add(portraitMesh);

            statusEl.textContent = '📸 上传你的照片，拖动查看3D效果！';
            statusEl.className = 'success';
        }

        // ----- 粒子 -----
        function createParticles() {
            const count = 500;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i*3] = (Math.random() - 0.5) * 30;
                positions[i*3+1] = (Math.random() - 0.5) * 20;
                positions[i*3+2] = (Math.random() - 0.5) * 15 - 5;
                const c = new THREE.Color().setHSL(0.65 + Math.random()*0.15, 0.6, 0.4 + Math.random()*0.3);
                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
            });
            particlesMesh = new THREE.Points(geo, mat);
            particlesMesh.position.z = -3;
            scene.add(particlesMesh);
        }

        // ================================================================
        //  交互控制
        // ================================================================
        function onDragStart(e) {
            isDragging = true;
            autoRotate = false;
            prevX = e.clientX;
            prevY = e.clientY;
        }

        function onDragMove(e) {
            if (!isDragging) return;
            const dx = (e.clientX - prevX) / window.innerWidth;
            const dy = (e.clientY - prevY) / window.innerHeight;
            targetX += dx * 3;
            targetY += dy * 2;
            targetX = Math.max(-1, Math.min(1, targetX));
            targetY = Math.max(-0.8, Math.min(0.8, targetY));
            prevX = e.clientX;
            prevY = e.clientY;
        }

        function onDragEnd() {
            isDragging = false;
            // 3秒后恢复自动旋转
            setTimeout(() => { autoRotate = true; }, 3000);
        }

        function onTouchStart(e) {
            const touch = e.touches[0];
            if (touch) {
                isDragging = true;
                autoRotate = false;
                prevX = touch.clientX;
                prevY = touch.clientY;
            }
        }

        function onTouchMove(e) {
            if (!isDragging || !e.touches.length) return;
            const touch = e.touches[0];
            const dx = (touch.clientX - prevX) / window.innerWidth;
            const dy = (touch.clientY - prevY) / window.innerHeight;
            targetX += dx * 3;
            targetY += dy * 2;
            targetX = Math.max(-1, Math.min(1, targetX));
            targetY = Math.max(-0.8, Math.min(0.8, targetY));
            prevX = touch.clientX;
            prevY = touch.clientY;
        }

        function onTouchEnd() {
            isDragging = false;
            setTimeout(() => { autoRotate = true; }, 3000);
        }

        // ================================================================
        //  上传照片
        // ================================================================
        function handleUpload(file) {
            if (!file || !file.type.startsWith('image/')) {
                statusEl.textContent = '⚠️ 请上传图片文件';
                statusEl.className = 'warning';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let sw, sh, sx = 0, sy = 0;
                    const targetRatio = 4 / 3;
                    const imgRatio = img.width / img.height;
                    if (imgRatio > targetRatio) {
                        sw = img.height * targetRatio;
                        sh = img.height;
                        sx = (img.width - sw) / 2;
                    } else {
                        sw = img.width;
                        sh = img.width / targetRatio;
                        sy = (img.height - sh) / 2;
                    }
                    canvas.width = 1024;
                    canvas.height = 768;
                    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 1024, 768);
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.fillRect(0, 0, 1024, 768);
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText('📷 你的照片', 980, 730);

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.anisotropy = 4;

                    if (portraitMesh) {
                        portraitMesh.material.map = texture;
                        portraitMesh.material.needsUpdate = true;
                        statusEl.textContent = '✅ 照片已上传！拖动画面查看3D效果';
                        statusEl.className = 'success';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ================================================================
        //  窗口自适应
        // ================================================================
        function onResize() {
            const w = containerEl.clientWidth || window.innerWidth;
            const h = containerEl.clientHeight || window.innerHeight;
            if (camera) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(w, h);
            }
        }

        // ================================================================
        //  渲染循环
        // ================================================================
        function animate() {
            requestAnimationFrame(animate);

            // 自动旋转
            if (autoRotate && !isDragging) {
                targetX = Math.sin(Date.now() * 0.0003) * 0.5;
                targetY = Math.sin(Date.now() * 0.0005) * 0.2;
            }

            // 平滑跟随
            currentX += (targetX - currentX) * CONFIG.smoothFactor;
            currentY += (targetY - currentY) * CONFIG.smoothFactor;

            // 应用到图层
            const strength = CONFIG.parallaxStrength;
            if (portraitMesh) {
                portraitMesh.position.x = -currentX * strength * 3.5;
                portraitMesh.position.y = -currentY * strength * 2.5;
                portraitMesh.rotation.y = currentX * 0.05;
                portraitMesh.rotation.x = currentY * 0.03;
            }

            if (backgroundMesh) {
                backgroundMesh.position.x = -currentX * strength * 1.0;
                backgroundMesh.position.y = -currentY * strength * 0.6;
                backgroundMesh.rotation.y = -currentX * 0.02;
                backgroundMesh.rotation.x = -currentY * 0.01;
            }

            if (particlesMesh) {
                particlesMesh.rotation.y += 0.0003;
                particlesMesh.position.x = currentX * 0.005;
                particlesMesh.position.y = currentY * 0.005;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // ================================================================
        //  启动
        // ================================================================
        function init() {
            try {
                initScene();
                animate();

                fileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        handleUpload(e.target.files[0]);
                        fileInput.value = '';
                    }
                });
                uploadBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    fileInput.click();
                });

                // 点击照片恢复自动旋转
                renderer.domElement.addEventListener('dblclick', () => {
                    autoRotate = !autoRotate;
                    statusEl.textContent = autoRotate ? '🔄 自动旋转已开启' : '✋ 手动控制模式';
                    statusEl.className = 'success';
                });

                console.log('✨ 3D活照片（精简版）已启动！');
                console.log('💡 上传照片，拖动画面查看3D效果，双击切换自动旋转');

            } catch (err) {
                console.error('Init error:', err);
                statusEl.textContent = '❌ 初始化失败: ' + err.message;
                statusEl.className = 'error';
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        } else {
            window.addEventListener('DOMContentLoaded', init);
        }

    })();
    </script>
</body>
</html>
