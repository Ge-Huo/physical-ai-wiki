<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机传感器物理实验</title>
    <!-- CSP配置：允许Chart.js和blob worker -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline'; worker-src 'self' blob:;">
    <!-- Chart.js 2.9.4 (兼容旧设备) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fafafa; }
        h1 { font-size: 20px; text-align: center; }
        p { font-size: 14px; color: #666; text-align: center; }
        #chart-container { width: 100%; max-width: 600px; margin: 20px auto; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { display: block; margin: 20px auto; padding: 12px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 6px; background: #1890ff; color: #fff; }
        button:active { background: #096dd9; }
        #status { text-align: center; font-size: 14px; color: #999; min-height: 20px; }
    </style>
</head>
<body>
    <h1>📱 手机加速度传感器实验</h1>
    <p>点击按钮 → 允许权限 → 摇晃手机观察曲线</p>
    <button id="startBtn">开始测量</button>
    <div id="status"></div>
    <div id="chart-container">
        <canvas id="accelerationChart"></canvas>
    </div>

<script>
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
let chart = null;
let isMeasuring = false;
let startTime = 0;
let rafId = null;

// ========== 初始化图表 ==========
function initChart() {
    const ctx = document.getElementById('accelerationChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'X轴', data: [], borderColor: '#f5222d', borderWidth: 2, fill: false, pointRadius: 0 },
                { label: 'Y轴', data: [], borderColor: '#52c41a', borderWidth: 2, fill: false, pointRadius: 0 },
                { label: 'Z轴', data: [], borderColor: '#1890ff', borderWidth: 2, fill: false, pointRadius: 0 },
                { label: '合加速度', data: [], borderColor: '#000', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0 }
            ]
        },
        options: {
            responsive: true,
            animation: false, // ✅ 关闭动画，避免手机端卡顿
            scales: {
                xAxes: [{ title: { display: true, text: '时间 (s)' }, ticks: { maxTicksLimit: 10 } }],
                yAxes: [{ title: { display: true, text: '加速度 (m/s²)' }, ticks: { min: -20, max: 20 } }]
            },
            legend: { position: 'bottom', labels: { boxWidth: 12, fontSize: 12 } }
        }
    });
}

// ========== 核心：带权限请求的开始测量 ==========
async function startMeasuring() {
    // ✅ 关键修复：iOS 13+ / 鸿蒙 权限请求
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
            const perm = await DeviceMotionEvent.requestPermission();
            if (perm !== 'granted') {
                statusEl.textContent = '❌ 权限被拒绝，请在系统设置中允许"身体传感器"';
                statusEl.style.color = '#f5222d';
                return;
            }
        } catch (err) {
            statusEl.textContent = '⚠️ 权限请求失败: ' + err.message;
            statusEl.style.color = '#faad14';
            return;
        }
    }

    // 重置数据
    isMeasuring = true;
    startTime = Date.now();
    chart.data.labels = [];
    chart.data.datasets.forEach(ds => ds.data = []);
    chart.update();
    startBtn.textContent = '停止测量';
    statusEl.textContent = '✅ 正在采集...请摇晃手机';
    statusEl.style.color = '#52c41a';

    window.addEventListener('devicemotion', handleMotion);
}

function stopMeasuring() {
    isMeasuring = false;
    window.removeEventListener('devicemotion', handleMotion);
    if (rafId) cancelAnimationFrame(rafId);
    startBtn.textContent = '开始测量';
    statusEl.textContent = '已停止';
    statusEl.style.color = '#999';
}

// ========== 数据处理（节流 + 安全兜底）==========
function handleMotion(event) {
    if (!isMeasuring) return;

    // ✅ 安全兜底：防止acc为null导致崩溃
    const acc = event.accelerationIncludingGravity;
    if (!acc || acc.x == null) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;
    const total = Math.sqrt(x * x + y * y + z * z);
    const time = ((Date.now() - startTime) / 1000).toFixed(2); // ✅ 相对时间，不会回绕

    // ✅ 使用requestAnimationFrame节流，避免每帧都update导致卡死
    if (!rafId) {
        rafId = requestAnimationFrame(() => {
            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(x);
            chart.data.datasets[1].data.push(y);
            chart.data.datasets[2].data.push(z);
            chart.data.datasets[3].data.push(total);

            // 限制最大点数
            const MAX_POINTS = 100;
            if (chart.data.labels.length > MAX_POINTS) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(ds => ds.data.shift());
            }

            chart.update();
            rafId = null;
        });
    }
}

// ========== 按钮事件绑定 ==========
startBtn.addEventListener('click', () => {
    if (isMeasuring) {
        stopMeasuring();
    } else {
        startMeasuring();
    }
});

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', initChart);
</script>
</body>
</html>
