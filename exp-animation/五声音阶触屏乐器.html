<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<!-- 全屏：Android/微信走 Fullscreen API；iPhone 的 Safari 不支持对网页全屏，
     只能靠"添加到主屏幕"，届时这两条 meta 会让它以无地址栏的全屏方式启动。
     status-bar-style=black-translucent 让状态栏透明、内容延伸上去（配合 env(safe-area-inset-*)）。 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="五声·触">
<meta name="theme-color" content="#0a0a12">
<title>五声·触</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: system-ui, sans-serif; }
  /* 横屏时左侧谱面栏的宽度：窄屏（667px 宽的横屏）也要留住 6 个键的宽度，
     所以下限 256px、上限 320px，中间跟视口走 */
  :root { --col: clamp(256px, 34vw, 320px); }

  /* 启动遮罩 */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: rgba(10,10,18,0.95); color: #e0e0e0; transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #start-btn {
    padding: 16px 48px; border: 1px solid rgba(255,255,255,0.3); border-radius: 40px;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 18px; letter-spacing: 4px; cursor: pointer;
  }
  #start-btn:active { background: rgba(255,255,255,0.2); }
  .hint { font-size: 12px; opacity: 0.5; }

  /* 琴键容器 */
  #keys {
    display: flex; width: 100%; height: 100%;
  }
  .key {
    flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom, 20px); border-right: 1px solid rgba(255,255,255,0.04);
    transition: background 0.08s; cursor: pointer; user-select: none; touch-action: none;
  }
  .key:last-child { border-right: none; }
  .key .label {
    font-size: 14px; color: rgba(255,255,255,0.38); letter-spacing: 2px; pointer-events: none;
    margin-bottom: 20px;
    /* 数字在上、唱名在下：跟弹条上写的是数字，键上必须能对上 */
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  /* 数字用键自己的颜色 —— 跟弹条上哪个数字亮什么色，这里就按哪个色找键 */
  .key .label b {
    font-size: 20px; font-weight: 500; line-height: 1; letter-spacing: 0;
    color: var(--color); opacity: 0.8;
  }
  .key .label b sup { font-size: 10px; vertical-align: super; opacity: 0.7; }
  .key .label i {
    font-style: normal; font-size: 11px; opacity: 0.75; letter-spacing: 1px;
  }
  .key.active { background: var(--glow); }
  .key.active .label { color: rgba(255,255,255,0.9); }
  .key.active .label b { opacity: 1; }
  .key.active .label i { opacity: 0.85; }

  /* 每个键独立配色。--glow 是按下时的整键底色，--pulse 是指引辉光的颜色（带透明度） */
  .key:nth-child(1) { --glow: rgba(100,180,255,0.15); --color: #64b4ff; --pulse: rgba(100,180,255,0.55); }
  .key:nth-child(2) { --glow: rgba(130,220,180,0.15); --color: #82dcb4; --pulse: rgba(130,220,180,0.52); }
  .key:nth-child(3) { --glow: rgba(255,200,100,0.15); --color: #ffc864; --pulse: rgba(255,200,100,0.55); }
  .key:nth-child(4) { --glow: rgba(220,140,180,0.15); --color: #dc8cb4; --pulse: rgba(220,140,180,0.55); }
  .key:nth-child(5) { --glow: rgba(180,140,255,0.15); --color: #b48cff; --pulse: rgba(180,140,255,0.58); }
  /* 第 6 键是高八度的宫，沿用第 1 键的蓝，视觉上形成一次音阶循环 */
  .key:nth-child(6) { --glow: rgba(100,180,255,0.18); --color: #7cc4ff; --pulse: rgba(124,196,255,0.58); }

  /* 高音标记：简谱在数字上方加点，这里用 sup 模拟 */
  .key .label sup { font-size: 9px; vertical-align: super; opacity: 0.65; margin-left: 1px; }

  /* 涟漪反馈 */
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--color) 0%, transparent 70%);
    transform: translate(-50%, -50%) scale(0); animation: rippleAnim 0.5s ease-out forwards;
  }
  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }

  /* 氛围切换按钮 */
  #mood-toggle {
    position: fixed; top: max(env(safe-area-inset-top, 12px), 12px); right: 16px; z-index: 50;
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); font-size: 12px;
    letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(8px);
  }
  #mood-toggle:active { background: rgba(255,255,255,0.15); }

  /* 横屏开关：手机开了「竖屏锁定」时系统不会转屏，网页也没权限强制转，
     所以给一个按钮自己把舞台转 90°。真横屏时 JS 会把它藏起来（那时它没意义）。 */
  #rot-toggle {
    position: fixed; z-index: 50;
    top: calc(max(env(safe-area-inset-top, 12px), 12px) + 42px); right: 16px;
    padding: 8px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); font-size: 12px;
    letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(8px);
  }
  #rot-toggle:active { background: rgba(255,255,255,0.15); }

  /* 全屏开关：和上面两个按钮竖排。全屏时文案变「退出全屏」，需要能一眼找到，
     所以用 .on 状态高亮，位置固定在右上角最外侧不被琴键的手挡住 */
  #fs-toggle {
    position: fixed; z-index: 50;
    top: calc(max(env(safe-area-inset-top, 12px), 12px) + 84px); right: 16px;
    padding: 8px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); font-size: 12px;
    letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(8px);
  }
  #fs-toggle:active { background: rgba(255,255,255,0.15); }
  #fs-toggle.on {
    color: #a8d8ff; border-color: rgba(124,196,255,0.45); background: rgba(124,196,255,0.12);
  }

  /* 全屏不可用时的说明条（iPhone Safari、部分微信版本）。
     只在点了没反应时出现几秒，不打扰正常使用。 */
  #fs-hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
    transform: translateX(-50%) translateY(8px); z-index: 90;
    /* 必须给确定宽度：fixed 元素的宽度是 shrink-to-fit，中文又能在任意字间断行，
       不给宽度它会缩成一条窄柱、每行只放五六个字，读起来像电报 */
    width: 86vw; max-width: 360px;
    padding: 11px 16px; border-radius: 16px;
    background: rgba(10,10,18,0.92); border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(12px);
    color: rgba(255,255,255,0.8); font-size: 12px; line-height: 1.75; letter-spacing: 0.3px;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
  }
  #fs-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 音频被浏览器挂起时的提示条（桌面端常见：策略拦截、标签页被静音）。
     和全屏提示不同，这条可以点——点一下就 resume，不是干看着。 */
  #audio-hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 146px);
    transform: translateX(-50%) translateY(8px); z-index: 92;
    width: 82vw; max-width: 340px;
    padding: 10px 16px; border-radius: 14px;
    background: rgba(214,158,46,0.15); border: 1px solid rgba(214,158,46,0.45);
    backdrop-filter: blur(12px);
    color: #f0d9a8; font-size: 12px; line-height: 1.7; letter-spacing: 0.3px;
    text-align: center; pointer-events: auto; cursor: pointer;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
  }
  #audio-hint.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  /* 首次进入的操作提示，5 秒后自动隐去 */
  #tip {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    padding: 9px 20px; border-radius: 18px; white-space: nowrap;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.72); font-size: 13px; letter-spacing: 1px;
    opacity: 0; transition: opacity 0.8s; pointer-events: none; z-index: 40;
    backdrop-filter: blur(6px);
  }
  #tip.show { opacity: 1; }

  /* ===== 瀑布流谱面 ===== */
  /* 画布与琴键区严格同框：竖屏、自由弹奏、瀑布流都满屏；横屏读谱时让出左栏。
     这里刻意用纯 CSS 对齐而不是让 JS 写 left/top/width/height——
     手动横屏时整个 body 被 rotate(90deg)，getBoundingClientRect 会返回旋转后的
     包围盒（宽高互换），JS 量出来的坐标全是错的；交给 CSS 就完全绕开这个坑。 */
  #chart {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.45s;
  }
  #chart.show { opacity: 1; }
  body.land.sheet-mode #chart { left: var(--col); width: calc(100% - var(--col)); }

  /* 曲目按钮，放左上角与右侧的氛围按钮分开 */
  #song-btn {
    position: fixed; top: max(env(safe-area-inset-top, 12px), 12px); left: 16px; z-index: 50;
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); font-size: 12px;
    letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(8px);
  }
  #song-btn:active { background: rgba(255,255,255,0.15); }
  #song-btn.on {
    color: #a8d8ff; border-color: rgba(124,196,255,0.45);
    background: rgba(124,196,255,0.12);
  }

  /* 下落速度档位：只在下落谱面出现时才需要，自由弹奏时藏起来。
     放在「弹一首」下面第二行，避免在 375px 窄屏上和右上角的氛围按钮撞车。 */
  #speed {
    position: fixed; z-index: 50;
    top: calc(max(env(safe-area-inset-top, 12px), 12px) + 42px); left: 16px;
    display: flex; gap: 2px; padding: 3px; border-radius: 20px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.35s;
  }
  #speed.show { opacity: 1; pointer-events: auto; }
  #speed button {
    padding: 6px 11px; border: 0; border-radius: 16px; background: transparent;
    color: rgba(255,255,255,0.45); font-size: 12px; letter-spacing: 1px;
    cursor: pointer; transition: color 0.2s, background 0.2s;
  }
  #speed button.on { color: #a8d8ff; background: rgba(124,196,255,0.16); }

  /* 乐句提示，随小节切换。
     top 从 9% 挪到 12%：给左上角的速度档位让出高度，否则 375px 窄屏上会叠在一起。
     加一层半透明底：音符从顶部下落时会穿过这一带，纯文字压上去读不清。 */
  #lyric {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    font-size: 19px; letter-spacing: 7px; color: rgba(255,255,255,0.85);
    padding: 5px 20px 5px 26px; border-radius: 20px;
    background: rgba(10,10,18,0.5); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.7s; pointer-events: none; z-index: 35;
    text-shadow: 0 0 24px rgba(124,196,255,0.55); white-space: nowrap;
  }
  #lyric.show { opacity: 1; }

  /* 结束卡片：只报"弹完了"，不给分数 */
  #song-end {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(10,10,18,0.84); backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none; transition: opacity 0.5s;
  }
  #song-end.show { opacity: 1; pointer-events: auto; }
  #song-end .title { font-size: 25px; letter-spacing: 9px; color: #fff; }
  #song-end .sub { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 4px; }
  #song-end .btns { display: flex; gap: 12px; margin-top: 10px; }
  #song-end button {
    padding: 13px 28px; border-radius: 26px; font-size: 13px; letter-spacing: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); color: #fff;
  }
  #song-end button.primary {
    background: rgba(124,196,255,0.16); border-color: rgba(124,196,255,0.5); color: #a8d8ff;
  }

  /* ===== 曲目面板：底部滑出 ===== */
  #song-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
    max-height: 72vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 16px calc(env(safe-area-inset-bottom, 16px) + 20px);
    border-radius: 24px 24px 0 0;
    background: rgba(16,17,28,0.96); backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.1);
    transform: translateY(102%); transition: transform 0.38s cubic-bezier(0.22, 0.9, 0.3, 1);
  }
  #song-panel.show { transform: translateY(0); }
  #song-panel .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 6px 12px;
  }
  #song-panel .panel-title { font-size: 17px; letter-spacing: 4px; color: #fff; }
  #song-panel .panel-close {
    border: 0; background: transparent; color: rgba(255,255,255,0.45);
    font-size: 13px; letter-spacing: 2px; cursor: pointer; padding: 6px 10px;
  }
  /* 曲目卡：整卡点击 = 跟弹（新手默认），右侧小按钮 = 瀑布流 */
  .song-card {
    display: flex; align-items: center;
    padding: 15px 16px; margin-bottom: 10px; border-radius: 18px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
  }
  .song-card:active { background: rgba(255,255,255,0.1); }
  .song-card .s-main { flex: 1; min-width: 0; }
  .song-card .s-title {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 16px; color: #fff; letter-spacing: 2px;
  }
  /* 「全曲 · 5 段 20 句」：选曲时就能确认这是完整版，而不是节选 */
  .song-card .s-meta {
    font-size: 10px; letter-spacing: 0.5px; color: rgba(255,255,255,0.32); flex-shrink: 0;
  }
  .song-card .s-preview {
    margin-top: 7px; font-size: 12px; color: rgba(255,255,255,0.42);
    letter-spacing: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .song-card .s-fall {
    flex-shrink: 0; margin-left: 12px; padding: 9px 14px;
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.16);
    background: transparent; color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 1px;
    cursor: pointer;
  }
  .song-card .s-fall:active { background: rgba(255,255,255,0.1); }
  /* 面板里的说明行 */
  #song-panel .panel-hint {
    padding: 0 6px 14px; font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 1px;
  }

  /* ===== 跟弹模式：屏幕上方的简谱条 ===== */
  #follow {
    /* 顶部留出右上角那排控制按钮（氛围 / 横屏 / 全屏，最下面一个底边在 131px）：
       原来写 9%，面板矮时刚好错开，底栏加了「节拍 / 全曲示范」之后面板变高、
       往上顶着走，进度「第 X / Y 句」正好被「全屏」压住。改成按按钮高度让位 */
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 142px);
    transform: translateX(-50%);
    z-index: 35; width: min(94vw, 480px);
    padding: 16px 18px 14px; border-radius: 22px; text-align: center;
    background: rgba(10,10,18,0.62); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    opacity: 0; pointer-events: none; transition: opacity 0.45s;
  }
  #follow.show { opacity: 1; pointer-events: auto; }
  /* ===== 跟弹简谱表：滚动窗口一次只呈现 4 句，弹到哪滑到哪 ===== */
  #follow .f-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px; padding-bottom: 7px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  #follow .f-song {
    font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.85);
    text-shadow: 0 0 14px rgba(124,196,255,0.4);
  }
  #follow .f-prog { font-size: 10.5px; letter-spacing: 1px; color: rgba(255,255,255,0.4); }
  /* 窗口固定 4 句，高度恒定，不需要滚动：原先的 max-height + 滚动条会因
     1px 取整溢出而常驻一条细滚动条，看着像"没做完"，直接按内容撑开 */
  #follow .f-sheet { overflow: visible; }
  #follow .f-row {
    display: flex; align-items: center; gap: 10px; padding: 5px 2px;
  }
  #follow .f-row + .f-row { border-top: 1px dashed rgba(255,255,255,0.07); }
  /* 全曲化的歌都分段落（沧海五段、兔子两段…）：段落之间留白 + 取消虚线，
     让"第几段"一眼可辨——歌词书里也是这么排的 */
  #follow .f-row.verse-start { margin-top: 10px; border-top: none; }
  /* 弹完的整句：整行变暗，但保留位置，能看出"已经唱到这了" */
  #follow .f-row.done-row { opacity: 0.32; }
  /* 滚动窗口的省略行：窗口上下各一句"⋯"，表示前面/后面还有内容没画出来 */
  #follow .f-more {
    text-align: center; font-size: 10px; letter-spacing: 7px;
    color: rgba(255,255,255,0.22); padding: 2px 0 0; line-height: 1;
  }
  #follow .r-lyric {
    /* 8.5em ≈ 98px：容得下最长 8 字歌词（「涛浪淘尽红尘俗世」），
       再窄就会出省略号——曲名句子被截断，新手就看不懂这句该怎么唱了 */
    flex-shrink: 0; width: 8.5em; text-align: right;
    font-size: 11.5px; letter-spacing: 0.5px; color: rgba(255,255,255,0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #follow .r-notes {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end;
  }
  #follow .f-note {
    font-size: 17px; color: rgba(255,255,255,0.35); line-height: 1;
    padding: 5px 4px 4px; border-radius: 8px;
    transition: transform 0.15s, color 0.15s, opacity 0.15s;
  }
  #follow .f-note sup { font-size: 9px; vertical-align: super; }
  /* 已弹过的音：暗下去但保留位置。!important 压过 inline 的键色 */
  #follow .f-note.done { color: rgba(255,255,255,0.16) !important; }
  /* 当前音：放大 + 用琴键专属颜色点亮，颜色即"按哪个键"的直接暗示 */
  #follow .f-note.cur {
    transform: scale(1.45); font-weight: 600; opacity: 1;
    text-shadow: 0 0 16px currentColor;
  }
  #follow .f-hint {
    margin-top: 10px; font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.32);
  }
  /* 跟弹面板底部一排小按钮：节拍开关 / 全曲示范 / 再看演示。
     三个并排而不是竖着堆——堆起来会把简谱窗挤到滚动，横屏更放不下 */
  #follow .f-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #follow .f-acts button {
    flex: 1 1 auto; padding: 7px 10px; border-radius: 14px;
    border: 1px solid rgba(124,196,255,0.32); background: rgba(124,196,255,0.08);
    color: #a8d8ff; font-size: 11.5px; letter-spacing: 1px; cursor: pointer;
    white-space: nowrap;
  }
  #follow .f-acts button:active { background: rgba(124,196,255,0.22); }
  /* 开启态（节拍开 / 示范播放中）：亮起来，一眼看出当前状态 */
  #follow .f-acts button.on {
    border-color: rgba(124,196,255,0.7); background: rgba(124,196,255,0.26);
    color: #e2f2ff;
  }

  /* ===== 键位发光提示（跟弹模式核心引导）=====
     下一个要弹的键直接呼吸发亮，颜色用键自己的专属色。
     目的是让视线不用离开琴键：不用看谱面、不用数格子，亮哪儿按哪儿。

     注意：这里用"底部径向辉光"而不是整键 box-shadow inset。
     琴键是满屏高的（约 800px），inset 阴影会从上到下糊满整列，
     看起来像一根光柱、不像"这个键亮了"。辉光只压在下半部，
     正好是手指落点的高度，视觉上是一团光而不是一片墙。 */
  .key.pulse::before,
  .key.demo-hit::before {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 44px; height: 130px;
    /* 椭圆半径必须显式给，且按"宽一点、矮一点"来：默认 farthest-corner 会把
       竖向半径算成整列高度，结果又变成一根光柱。这里约 43×57px，是一团圆光。 */
    background: radial-gradient(ellipse 66% 44% at 50% 52%, var(--pulse) 0%, transparent 72%);
    pointer-events: none;
  }
  .key.pulse::before { animation: keyPulse 1.2s ease-in-out infinite; }
  .key.demo-hit::before { opacity: 1; }   /* 幽灵手演示：稳定亮着，不闪 */
  @keyframes keyPulse {
    0%, 100% { opacity: 0.28; }
    50%      { opacity: 1; }
  }

  /* 节拍提示：到「该按下一音」的时刻，在目标键上打一个极短的白色小光点。
     要和 .pulse 一眼区分开——pulse 是持续呼吸（意思是「就是这里」），
     beat-flash 是一次性短闪（意思是「现在」）。两者叠在同一键上也不糊。 */
  .key.beat-flash::after {
    content: '';
    position: absolute; left: 50%; bottom: 96px;
    width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: #ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.85);
    pointer-events: none; animation: beatFlash 0.18s ease-out;
  }
  .key.beat-flash .label b { transform: scale(1.12); }
  @keyframes beatFlash {
    0%   { opacity: 0; transform: scale(1.6); }
    40%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.7); }
  }
  .key.pulse .label b,
  .key.demo-hit .label b { opacity: 1; text-shadow: 0 0 18px currentColor; }

  /* ===== 横屏布局：左侧谱面栏 + 右侧琴键 =====
     竖屏保持原样（谱面浮在琴键上方，键铺满整屏）。
     横屏高度只有 320~430px，谱面若仍浮在琴键上会盖住 1~2 个键、那几个键就按不到了，
     所以读谱时改成左右分栏：左边读谱、右边弹奏，互不遮挡；琴键仍是竖向长条，手感不变。
     自由弹奏和瀑布流不读谱，就保持满屏琴键（body 没有 sheet-mode 时）。

     这里不用 @media (orientation: landscape)：媒体查询只认系统给的真实视口，
     手机一开「竖屏锁定」就永远不命中，网页也没有权限强制转屏
     （screen.orientation.lock 只在 Android 全屏下有效，iOS 完全不支持）。
     所以改成 class 驱动 —— 真横屏由 JS 给 body 加 .land；竖屏下点「横屏」按钮时
     再额外给 html 加 .rot 把整个舞台旋转 90°，两路共用这一套规则，不用维护两份。 */
  body.land.sheet-mode #keys {
    width: calc(100% - var(--col));
    margin-left: var(--col);
  }
  body.land .key { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  body.land .key .label { margin-bottom: 8px; }
  body.land .key .label b { font-size: 17px; }
  body.land .key .label i { font-size: 10px; }

  /* 「氛围」跟着谱面栏走，免得浮在琴键上误触（自由弹奏时它还在右上角） */
  body.land.sheet-mode #mood-toggle { left: auto; right: calc(100% - var(--col) + 12px); }

  /* 跟弹面板：左栏居中。速度档在跟弹模式本是隐藏的（opacity:0 + 不可点），
     所以不会和它打架，也不会挡住琴键 */
  body.land #follow {
    left: 12px; top: 50%; transform: translateY(-50%);
    width: calc(var(--col) - 24px);
    max-height: calc(100% - 70px); overflow-y: auto;
    padding: 13px 14px 12px; border-radius: 18px; text-align: left;
  }
  body.land #follow .f-row { gap: 7px; padding: 4px 0; }
  body.land #follow .r-lyric { width: 6.6em; font-size: 10.5px; }
  body.land #follow .f-note { font-size: 15px; padding: 4px 3px 3px; }
  body.land #follow .f-song { font-size: 12px; letter-spacing: 2px; }
  body.land #follow .f-prog { font-size: 10px; }
  body.land #follow .f-hint { margin-top: 8px; font-size: 10px; letter-spacing: 1.5px; }
  body.land #follow .f-acts { margin-top: 9px; gap: 6px; }
  body.land #follow .f-acts button { padding: 6px 8px; font-size: 10.5px; letter-spacing: 0.5px; }

  /* 选曲面板：横屏高度只有 390px，单列只能露 3 张卡，改两列一屏放下 5 首；
     卡片同步压矮，否则两列省下的高度又被行高吃掉、还是会冒滚动条 */
  body.land #song-panel {
    max-height: 94vh;
    padding: 12px 14px calc(env(safe-area-inset-bottom, 12px) + 12px);
  }
  body.land #song-panel .panel-head { padding: 0 4px 8px; }
  body.land #song-panel .panel-title { font-size: 15px; }
  body.land #song-panel .panel-hint { padding: 0 4px 10px; font-size: 11px; }
  body.land #song-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  body.land .song-card { padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; }
  body.land .song-card .s-title { font-size: 15px; }
  body.land .song-card .s-preview { margin-top: 5px; }
  body.land .song-card .s-fall { padding: 7px 12px; }

  /* ===== 手动横屏：把舞台自己转 90°，不依赖系统转屏 =====
     手机开着「竖屏锁定」时，系统不会转、网页也改不了（这是 OS 权限）。
     那就自己转：body 的布局尺寸换成 100vh×100vw（正好是横屏的宽高），
     再顺时针转 90° 贴回竖屏——于是竖着拿手机，看到的是一块横屏画布。
     旋转后 body 会成为内部所有 position:fixed 元素的包含块，坐标自然就是横屏坐标系，
     所以上面那一整套 .land 规则原封不动就能用，不需要第二套样式。
     变换顺序（从右往左）：先 rotate 90° 把布局盒转到 x∈[-H,0]，再 translateX(100vw) 推回来，
     两个角分别落在 (100vw,0) 和 (0,100vh)，正好铺满竖屏。 */
  html.rot body {
    position: fixed; left: 0; top: 0;
    width: 100vh; height: 100vw;
    transform-origin: top left;
    transform: translateX(100vw) rotate(90deg);
  }
</style>
</head>
<body>

<div id="overlay">
  <button id="start-btn">触 · 开始</button>
  <div class="hint">建议佩戴耳机体验</div>
</div>

<button id="mood-toggle">氛围：空灵</button>
<button id="rot-toggle">横屏</button>
<button id="fs-toggle">全屏</button>
<button id="song-btn">弹一首</button>
<div id="speed">
  <button data-i="0">慢</button>
  <button data-i="1">标准</button>
  <button data-i="2">快</button>
</div>
<div id="tip">按住琴键横向划动 → 连奏</div>
<canvas id="chart"></canvas>
<div id="lyric"></div>
<div id="follow">
  <div class="f-head"><span class="f-song"></span><span class="f-prog"></span></div>
  <div class="f-sheet"></div>
  <div class="f-hint">照着发光的键弹 · 弹对了自动走</div>
  <div class="f-acts">
    <button class="f-beat">节拍 · 关</button>
    <button class="f-master">全曲示范</button>
    <button class="f-demo">再看演示</button>
  </div>
</div>
<div id="song-panel">
  <div class="panel-head">
    <div class="panel-title">弹一首</div>
    <button class="panel-close">收起</button>
  </div>
  <div class="panel-hint">点歌名先看演示，再照发光键弹；「下落」是瀑布版</div>
  <div id="song-list"></div>
</div>
<div id="song-end">
  <div class="title">曲终</div>
  <div class="sub">你弹完了</div>
  <div class="btns">
    <button id="again-btn" class="primary">再弹一次</button>
    <button id="quit-btn">自由弹奏</button>
  </div>
</div>
<div id="keys"></div>

<script>
// ========== 音频引擎 ==========
// 五声音阶（宫商角徵羽）+ 高八度的宫，共 6 键。
// 加第 6 键是为了让《茉莉花》那类需要高音 do 的曲子能弹下来。
const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C4 D4 E4 G4 A4 C5
// 简谱数字：宫1 商2 角3 徵5 羽6 高音宫1。琴键与跟弹条共用这一份映射。
const NUM_LABELS = ['1', '2', '3', '5', '6', '1'];
const MOODS = {
  // decay     —— 单击时的长尾音，负责空间感
  // playDecay —— 滑音时的短尾音，负责旋律清晰度。尾音必须明显短于按键间隔，
  //              否则相邻音在频率上互相掩蔽，听起来只有一团嗡鸣，听不出调子。
  ethereal: { label: '空灵', droneFreqs: [130.81, 196.00], filterFreq: 800,  decay: 2.5, playDecay: 0.42 },
  warm:     { label: '温暖', droneFreqs: [130.81, 164.81], filterFreq: 1200, decay: 1.8, playDecay: 0.42 },
  dark:     { label: '幽深', droneFreqs: [110.00, 164.81], filterFreq: 500,  decay: 3.0, playDecay: 0.46 },
  // 底噪是持续音，手机外放小喇叭放不好 110~130Hz（低频被切掉、只剩失真谐波），
  // 听感就是一直嗡嗡。给它一个能关掉的档，也让"只想弹琴"的人安静。
  off:      { label: '关',   droneFreqs: [],                    filterFreq: 800,  decay: 2.5, playDecay: 0.42 },
};
const MOOD_KEYS = Object.keys(MOODS);

// 手机外放对 100~200Hz 的还原极差：正弦波被扬声器非线性削顶，谐波变成"嗡嗡"的
// 嗡嗡声反而比电脑上更响。所以移动端把底噪压到三分之一，且**默认关闭**——
// 想听氛围点一下氛围按钮即可，不想听就一直清清爽爽。
const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
                 ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const DRONE_LEVEL = IS_TOUCH ? 0.026 : 0.05;

let ctx, masterGain, droneOscs = [];
// 手机默认「关」：外放听不出氛围、只剩嗡嗡；电脑默认「空灵」
let currentMoodIdx = IS_TOUCH ? MOOD_KEYS.indexOf('off') : 0;
let isAudioStarted = false;

function initAudio() {
  if (isAudioStarted) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { showAudioHint('这个浏览器不支持网页音频，换 Chrome 或 Safari 试试'); return; }
  ctx = new AC();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.6;
  masterGain.connect(ctx.destination);
  startDrone();
  isAudioStarted = true;
  // 浏览器（尤其桌面 Chrome/Edge、以及开了"阻止自动播放"的情况）经常把新建的
  // AudioContext 直接置为 suspended：此时 currentTime 停在 0，所有节点都排上队
  // 却永不发声 —— 表现就是"整页一点声音都没有"。必须显式 resume。
  unlockAudio();
  // 状态变化（被系统挂起/恢复）也要反映到提示条上
  ctx.onstatechange = updateAudioHint;
  updateAudioHint();
}

/**
 * 恢复被浏览器挂起的音频上下文。
 * 只在用户手势里调用才有效，所以琴键、按钮、页面回前台都挂一份。
 */
function unlockAudio() {
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    const p = ctx.resume();
    if (p && p.catch) p.catch(() => {});
  }
}

// 声音没起来时给一条可点的提示，而不是让用户对着静音页面猜原因
function audioHintEl() {
  let el = document.getElementById('audio-hint');
  if (!el) {
    el = document.createElement('div');
    el.id = 'audio-hint';
    el.addEventListener('click', () => {
      unlockAudio();
      // resume 是异步的，给它一拍再判状态
      setTimeout(updateAudioHint, 260);
    });
    document.body.appendChild(el);
  }
  return el;
}

function updateAudioHint() {
  if (!isAudioStarted) return;
  const el = audioHintEl();
  const paused = !!ctx && ctx.state !== 'running';
  el.classList.toggle('show', paused);
  if (paused) el.textContent = '浏览器把声音暂停了 · 点这里恢复';
}

function showAudioHint(text) {
  const el = audioHintEl();
  el.textContent = text;
  el.classList.add('show');
}

function startDrone() {
  stopDrone();
  const mood = MOODS[MOOD_KEYS[currentMoodIdx]];
  mood.droneFreqs.forEach(freq => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = mood.filterFreq;
    filter.Q.value = 1;
    gain.gain.value = 0;
    // 淡入（移动端音量另有折扣，见 DRONE_LEVEL）
    gain.gain.setTargetAtTime(DRONE_LEVEL, ctx.currentTime, 1.5);
    osc.connect(filter).connect(gain).connect(masterGain);
    osc.start();
    droneOscs.push({ osc, gain, filter });
  });
}

function stopDrone() {
  droneOscs.forEach(d => {
    d.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.3);
    d.osc.stop(ctx.currentTime + 1);
  });
  droneOscs = [];
}

/**
 * 发声。
 * @param {number} freq 频率
 * @param {'air'|'play'} mode
 *   air  —— 单击：长尾音，空间感强，适合氛围聆听
 *   play —— 滑音：短尾音 + 快起音 + 更亮的滤波起点，让一串音前后分明
 * @param {number} vel 力度倍数（≈0.85~1.2）。示范时用它做重音与收句的强弱，
 *                     没有力度差的一串等响音听起来就是"电子音阶"，不像演奏。
 */
function playNote(freq, mode = 'air', vel = 1) {
  if (!ctx) return null;
  // 上下文被挂起时不要建节点：currentTime 不会走，这批节点会全排在 t=0，
  // 等某次恢复时在同一瞬间齐射（一串爆音），而当下依然是静音。
  if (ctx.state !== 'running') { unlockAudio(); return null; }
  const mood = MOODS[MOOD_KEYS[currentMoodIdx]];
  const isPlay = mode === 'play';
  const decay = isPlay ? mood.playDecay : mood.decay;
  const attack = isPlay ? 0.006 : 0.02;
  const peak = (isPlay ? 0.30 : 0.35) * Math.max(0.2, Math.min(1.4, vel));

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'triangle';
  osc.frequency.value = freq;

  filter.type = 'lowpass';
  filter.Q.value = 2;
  // 滑音时滤波起点抬高，音头更"脆"，连续五个音才分得开
  filter.frequency.setValueAtTime(mood.filterFreq * (isPlay ? 3.2 : 2), ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(mood.filterFreq * 0.5, ctx.currentTime + decay);

  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(peak, ctx.currentTime + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + decay);

  osc.connect(filter).connect(gain).connect(masterGain);
  osc.start();
  osc.stop(ctx.currentTime + decay + 0.1);

  return { osc, gain, filter };
}

/**
 * 全曲示范用的低八度铺底，只在每句第一音（强拍）触发。
 * 用 triangle 而不是 sine：手机外放推不动 130Hz 的正弦波，
 * 有奇次谐波才听得见"下面还有个低音"，不至于糊成嗡嗡。
 */
function playBass(freq) {
  if (!ctx || ctx.state !== 'running') return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.value = freq / 2;
  filter.type = 'lowpass';
  filter.frequency.value = 420;
  filter.Q.value = 0.7;
  const peak = IS_TOUCH ? 0.05 : 0.10;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(peak, t + 0.035);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
  osc.connect(filter).connect(gain).connect(masterGain);
  osc.start(t); osc.stop(t + 1.7);
}

/**
 * 节拍提示音：一声极短的"嗒"。
 * 句首用更高的音（2320Hz）、句内用 1560Hz——重拍有区别，才听得出"一句又开始了"，
 * 全都一个调的滴答很快就会变成噪音。
 */
function playTick(accent) {
  if (!ctx || ctx.state !== 'running') return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(accent ? 2320 : 1560, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(accent ? 0.07 : 0.045, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0004, t + 0.09);
  osc.connect(gain).connect(masterGain);
  osc.start(t); osc.stop(t + 0.12);
}

// ========== UI 构建 ==========
const NOTE_NAMES = ['宫', '商', '角', '徵', '羽', '宫'];
const HIGH_DOT = 5; // 第 6 键是高八度的宫，按简谱习惯在右上角加高音点
const keysContainer = document.getElementById('keys');

PENTATONIC.forEach((freq, i) => {
  const key = document.createElement('div');
  key.className = 'key';
  key.dataset.freq = freq;
  key.dataset.idx = i; // 曲目模式判定要用键序号
  const dot = i === HIGH_DOT ? '<sup>·</sup>' : '';
  // 数字在上（简谱，跟弹条用的就是它）、唱名在下；高音宫的数字右上角加点
  key.innerHTML = `<span class="label"><b>${NUM_LABELS[i]}${dot}</b><i>${NOTE_NAMES[i]}</i></span>`;
  keysContainer.appendChild(key);
});
// 琴键引用。必须在任何 ripple 挂进 #keys 之前取，否则 children 里会混进涟漪元素
const keyEls = Array.from(keysContainer.children);

// ========== 触控处理（支持多点） ==========
const activeTouches = new Map();

function handleTouch(e) {
  e.preventDefault();
  const touches = e.changedTouches;
  for (let i = 0; i < touches.length; i++) {
    const t = touches[i];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const key = el?.closest?.('.key');

    if (e.type === 'touchstart' && key) {
      activeTouches.set(t.identifier, key);
      pressed.add(+key.dataset.idx); // 按住状态，供曲目模式做宽容判定
      activateKey(key);
    } else if (e.type === 'touchmove') {
      const prevKey = activeTouches.get(t.identifier);
      if (key && key !== prevKey) {
        if (prevKey) { deactivateKey(prevKey); pressed.delete(+prevKey.dataset.idx); }
        activeTouches.set(t.identifier, key);
        pressed.add(+key.dataset.idx);
        // 把来源键传进去，activateKey 据此判定这是"连奏"而不是"单击"
        activateKey(key, prevKey);
      } else if (!key && prevKey) {
        deactivateKey(prevKey);
        pressed.delete(+prevKey.dataset.idx);
        activeTouches.delete(t.identifier);
      }
    } else if (e.type === 'touchend' || e.type === 'touchcancel') {
      const prevKey = activeTouches.get(t.identifier);
      if (prevKey) { deactivateKey(prevKey); pressed.delete(+prevKey.dataset.idx); }
      activeTouches.delete(t.identifier);
    }
  }
}

// 记录每个键最近一次发声的节点引用，滑走时用来快速收掉长尾音
const keyVoice = new WeakMap();

/**
 * @param {Element} key        要触发的键
 * @param {Element|null} from  手指从哪个键滑过来的；有值即视为连奏
 */
function activateKey(key, from = null) {
  // 曲目模式下，每一次按键都送进判定。按错不惩罚，但判定必须发生在
  // "是否已经 active" 的拦截之前，否则按住不放时后续音符就判不到了。
  // 跟弹只看"弹没弹对音"，瀑布流才看时间窗。
  if (songState.active && !songState.finished) {
    if (songState.mode === 'follow') followJudge(+key.dataset.idx);
    else songJudge(+key.dataset.idx);
  }

  if (key.classList.contains('active')) return;
  key.classList.add('active');

  // 连奏时先收掉上一个音的长尾，否则 2.5s 的余音会盖住后面的旋律
  if (from && ctx) {
    const prev = keyVoice.get(from);
    if (prev) prev.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.04);
  }

  // 曲目模式一律用短尾音，否则旋律会糊成一片
  const usePlay = from || songState.active;
  const voice = playNote(parseFloat(key.dataset.freq), usePlay ? 'play' : 'air');
  if (voice) keyVoice.set(key, voice);
  spawnRipple(key);
}

function deactivateKey(key) {
  key.classList.remove('active');
}

function spawnRipple(key) {
  const r = document.createElement('div');
  r.className = 'ripple';
  // 用 offset* 而不是 rect：手动横屏下 rect 是旋转后的包围盒，宽高会对调，
  // 水波纹会算成一个盖住半个键的大圆
  const rw = key.offsetWidth || 40, rh = key.offsetHeight || 200;
  r.style.left = rw / 2 + 'px';
  r.style.bottom = '60px';
  r.style.width = r.style.height = Math.min(rw, rh) * 0.6 + 'px';
  key.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

keysContainer.addEventListener('touchstart', handleTouch, { passive: false });
keysContainer.addEventListener('touchmove', handleTouch, { passive: false });
keysContainer.addEventListener('touchend', handleTouch, { passive: false });
keysContainer.addEventListener('touchcancel', handleTouch, { passive: false });

// 鼠标兼容（桌面调试用，同样支持按住拖动连奏）
let mouseKey = null;

keysContainer.addEventListener('mousedown', e => {
  const key = e.target.closest('.key');
  if (!key) return;
  mouseKey = key;
  pressed.add(+key.dataset.idx);
  activateKey(key);
});
keysContainer.addEventListener('mousemove', e => {
  if (!mouseKey) return;
  const key = e.target.closest('.key');
  if (key && key !== mouseKey) {
    deactivateKey(mouseKey);
    pressed.delete(+mouseKey.dataset.idx);
    activateKey(key, mouseKey);
    pressed.add(+key.dataset.idx);
    mouseKey = key;
  }
});
window.addEventListener('mouseup', () => {
  if (mouseKey) {
    deactivateKey(mouseKey);
    pressed.delete(+mouseKey.dataset.idx);
    mouseKey = null;
  }
});

/**
 * 把 phrases 派生成瀑布流引擎需要的数据结构。
 * 每音 1 拍、句末音 2 拍；lyrics 记录每句的起始拍。
 */
function buildSong(def) {
  const seq = [];
  const lyrics = [];
  let beat = 0;
  for (const p of def.phrases) {
    lyrics.push({ beat, text: p.text });
    p.notes.forEach((k, i) => {
      const dur = i === p.notes.length - 1 ? 2 : 1;
      seq.push([k, beat, dur]);
      beat += dur;
    });
  }
  return Object.assign({}, def, { seq, lyrics });
}
const SONG_MAP = {};
SONGS.forEach(s => { SONG_MAP[s.id] = buildSong(s); });

// 下落速度三档。sec = 音符从屏幕顶部落到判定线所用秒数，win = 判定窗口 ±秒。
// 两者必须成对出现：速度越快，视觉上留给你反应的时间越短，
// 如果判定窗口不变，快档会变成"看得见但按不准"，让人误以为是自己手残。
// 所以快档同步收紧窗口，让"难"体现在节奏上，而不是判定的随机性上。
const FALL_PRESETS = [
  { id: 'slow', label: '慢',   sec: 2.2, win: 0.24 },
  { id: 'std',  label: '标准', sec: 1.7, win: 0.21 },
  { id: 'fast', label: '快',   sec: 1.2, win: 0.17 },
];
const HOLD_WINDOW = 0.09; // 按住不放时每帧的宽容判定

// 当前档位。用 let：切换时要能改，且要写回 localStorage
const FALL_KEY = 'wuyin.fall';
let fallPreset = FALL_PRESETS[1];   // 默认"标准" 1.7s
let hitWindow = fallPreset.win;     // 判定窗口，随档位联动

const chartEl = document.getElementById('chart');
const cctx = chartEl.getContext('2d');
const lyricEl = document.getElementById('lyric');
const songBtn = document.getElementById('song-btn');
const songEndEl = document.getElementById('song-end');

const songState = {
  active: false, finished: false, mode: 'fall',
  startTime: 0, endT: 0, spb: 1,
  notes: [], fx: [], lyricIdx: 0,
  song: null, songId: null, raf: 0,
};

// 当前按住的键，用于"按住不放也算命中"的宽容判定
const pressed = new Set();
const geom = { W: 0, H: 0, x: 0, y: 0, judgeY: 0, keyW: 0, speed: 0 };

function resizeChart() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // 谱面只铺在"琴键区"上：竖屏时键区就是整屏，横屏时是右侧那半边。
  // 用 offsetWidth/offsetHeight 而不是 getBoundingClientRect：
  // 手动横屏时 body 被 rotate(90deg)，rect 返回的是旋转后的包围盒（宽高互换），
  // 拿它当画布尺寸会让音符整体错位；offset* 是布局尺寸，完全不受 transform 影响。
  // 也让 #chart 的 position 由 CSS 负责，这里只管分辨率。
  const w = keysContainer.offsetWidth;
  const h = keysContainer.offsetHeight;
  geom.W = w;
  geom.H = h;
  chartEl.width = Math.round(w * dpr);
  chartEl.height = Math.round(h * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  geom.keyW = geom.W / PENTATONIC.length;
  // 判定线放在键标签上方：手指自然落点在这里，而不是屏幕最底下
  geom.judgeY = geom.H - Math.max(120, geom.H * 0.155);
  geom.speed = geom.judgeY / fallPreset.sec;
}

function startSong(id) {
  if (!isAudioStarted) {
    initAudio();
    document.getElementById('overlay').classList.add('hidden');
  }
  const song = SONG_MAP[id] || SONG_MAP.canghai;
  lastStart = { id, mode: 'fall' };
  const spb = 60 / song.bpm;

  songState.song = song;
  songState.songId = id;
  songState.mode = 'fall';
  songState.spb = spb;
  songState.notes = song.seq.map(([k, beat, dur]) => ({
    k, t: beat * spb, dur: dur * spb, hit: false, missed: false, hitAt: 0,
  }));
  songState.endT = Math.max(...songState.notes.map(n => n.t)) + 2.2;
  // startTime 往后推一个下落时长，这样第一个音符从顶部出发、正好 sec 秒后到达判定线
  songState.startTime = performance.now() + fallPreset.sec * 1000;
  songState.active = true;
  songState.finished = false;
  songState.lyricIdx = 0;
  songState.fx = [];
  // 清掉上个模式残留的按住状态，否则进曲目时会白白送掉几个音符
  pressed.clear();

  // 瀑布流不读谱：横屏时把左栏还给琴键（不带 sheet-mode 就是满屏琴键）
  document.body.classList.remove('sheet-mode');
  resizeChart();
  chartEl.classList.add('show');
  speedEl.classList.add('show');
  followEl.classList.remove('show');
  songBtn.textContent = '结束';
  songBtn.classList.add('on');
  songEndEl.classList.remove('show');
  lyricEl.classList.remove('show');
  document.getElementById('tip').classList.remove('show');
  songEndEl.querySelector('.title').textContent = song.title;

  // 第一次进来的人不知道要干什么，先给一句规则说明；
  // 第一个乐句的歌词（提前 0.35s 触发）会自然把它顶掉
  showLyric('跟着光点 · 碰线就按');

  cancelAnimationFrame(songState.raf);
  songState.raf = requestAnimationFrame(chartLoop);
}

  const song = SONG_MAP[id] || SONG_MAP.canghai;
  lastStart = { id, mode: 'follow' };
  followState.active = true;
  followState.songId = id;
  followState.phrase = 0;
  followState.note = 0;
  songState.active = true;
  songState.finished = false;
  songState.mode = 'follow';
  songState.song = song;
  songState.songId = id;
  pressed.clear();
  stopBeat();   // 上一首可能还挂着一拍没响
  // 读谱模式：横屏时右移琴键、左栏留给谱面
  document.body.classList.add('sheet-mode');

  chartEl.classList.remove('show');
  speedEl.classList.remove('show');
  lyricEl.classList.remove('show');
  followEl.classList.add('show');
  songBtn.textContent = '结束';
  songBtn.classList.add('on');
  songEndEl.classList.remove('show');
  songEndEl.querySelector('.title').textContent = song.title;
  document.getElementById('tip').classList.remove('show');

  renderFollow();

  // 幽灵手演示：第一次弹某首曲子时，琴键自己按一遍给你看。
  // 不知道"目标长什么样"才是新手最大的迷茫——先看，再弹。
  // 同一首曲子只演示一次，「再看演示」按钮随时可以重看。
  if (!demoDone[id]) startDemo();
}

// ===== 幽灵手演示：琴键自动弹一遍 =====
// 用 setTimeout 排时间轴（按 bpm 换算），每个音：键闪 + 出声 + 简谱条同步高亮。
// 演示期间 followState.active = false，用户乱按不会推进进度、不会打断演示。
const demoState = { timers: [], playing: false, full: false };
const demoDone = {};   // 每首曲子只自动演示一次（本次会话内）
const demoBtn = followEl.querySelector('.f-demo');
const masterBtn = followEl.querySelector('.f-master');
const beatBtn = followEl.querySelector('.f-beat');

// 节拍开关的状态要放在这里：下面 demo 区块末尾会立刻调一次 syncBeatBtn()，
// 如果 let beatOn 写在更靠后的节拍区块里，那一刻还在 TDZ，直接报错。
const BEAT_KEY = 'wuyin.beat';
let beatOn = false;
try { beatOn = localStorage.getItem(BEAT_KEY) === '1'; } catch (e) {}
const beatState = { timer: 0, flashTimer: 0, el: null };

function stopDemoTimers() {
  demoState.timers.forEach(clearTimeout);
  demoState.timers = [];
}

function startDemo() {
  const song0 = SONG_MAP[followState.songId];
  if (!song0) return;                           // 还没选曲（面板隐藏时也可能被程序点到）
  if (demoState.full) finishMasterDemo(true);   // 全曲示范在放，先收掉
  stopDemoTimers();
  stopBeat();
  followState.active = false;   // 演示期间判定关闭
  followState.phrase = 0;
  followState.note = 0;
  demoState.playing = true;
  demoState.full = false;
  demoBtn.textContent = '跳过 · 我来弹';
  followEl.querySelector('.f-hint').textContent = '先看一遍：注意哪个键在亮';

  const song = song0;
  const spb = 60 / song.bpm;
  // seq 第 i 个音对应第几个乐句的第几个音，演示时简谱条跟着走到那个位置
  const posMap = [];
  song.phrases.forEach((p, pi) => p.notes.forEach((_, ni) => posMap.push({ pi, ni })));

  // 全曲化之后整首演示太长（沧海五段要一分多钟），演示只放第一段：
  // 第一段听懂旋律、看懂玩法就够了。beat 取自 seq，截取前缀节拍依然正确。
  const firstVerse = song.groups ? song.groups[0] : song.phrases.length;
  const demoSeq = song.seq.filter((_, i) => posMap[i].pi < firstVerse);
  const demoPos = posMap.filter(p => p.pi < firstVerse);

  demoSeq.forEach(([k, beat, dur], i) => {
    demoState.timers.push(setTimeout(() => {
      if (!demoState.playing) return;
      followState.phrase = posMap[i].pi;
      followState.note = posMap[i].ni;
      renderFollow();
      const key = keyEls[k];
      // 幽灵手：只用 demo-hit 的底部辉光，不叠整键泛光——满屏高的琴键上
      // 整键泛光会糊成一整根光柱，看起来不像"这个键被按下"
      key.classList.add('demo-hit');
      playNote(parseFloat(key.dataset.freq), 'play');
      spawnRipple(key);
      // 闪光时长跟音符时值走，句末长音多留一会
      demoState.timers.push(setTimeout(() => {
        if (!demoState.playing) return;
        key.classList.remove('demo-hit');
      }, Math.min(dur * spb * 0.72, 0.55) * 1000));
    }, beat * spb * 1000 + 300));   // 300ms 起始缓冲，让界面先落定
  });

  const last = demoSeq[demoSeq.length - 1];
  const total = (last[1] + last[2]) * spb * 1000 + 300 + 250;
  demoState.timers.push(setTimeout(() => {
    if (demoState.playing) finishDemo(false);
  }, total));
}

function finishDemo(skipped) {
  demoState.playing = false;
  stopDemoTimers();
  // 跳过时可能还残留着演示加上的闪光（ removal 定时器被清了），统一灭掉
  keyEls.forEach(el => el.classList.remove('active', 'demo-hit'));
  demoDone[followState.songId] = true;
  demoBtn.textContent = '再看演示';
  followState.active = true;
  followState.phrase = 0;
  followState.note = 0;
  renderFollow();
  // 演示只放第一段（全曲太长），文案要说清楚，否则新手会以为整首都演示过了
  followEl.querySelector('.f-hint').textContent =
    skipped ? '好，你来！照着发光的键弹' : '第一段听懂了？接着往下弹，亮哪儿按哪儿';
}

demoBtn.addEventListener('click', () => {
  if (demoState.full) finishMasterDemo(true);      // 全曲示范中：先停它
  else if (demoState.playing) finishDemo(true);    // 短演示中 = 跳过
  else startDemo();                                // 平时点它 = 重看
});

/* ===== 全曲示范：把整首从头到尾弹一遍 =====
   和"幽灵手"短演示的区别不只是长度，而是**演奏感**：
   - 力度：每句第一音重（1.2）、句末收（0.9），一串等响音听着就是电子音阶
   - 句首加低八度铺底，旋律立刻有"伴奏"，不再像是单音练习
   - 句末自动多留 5% 时值，句与句之间有了呼吸
   - 极小的长短起伏（±1.4%）：完全等长的音是节拍器，不是演奏
   全曲 60~110 秒，所以按钮会变成「停止」，随时可以中断。 */
function startMasterDemo() {
  const song = SONG_MAP[followState.songId];
  if (!song) return;
  stopDemoTimers();
  stopBeat();
  followState.active = false;
  followState.phrase = 0;
  followState.note = 0;
  demoState.playing = true;
  demoState.full = true;
  demoBtn.textContent = '再看演示';
  masterBtn.textContent = '停止';
  masterBtn.classList.add('on');

  const spb = 60 / song.bpm;
  const posMap = [];
  song.phrases.forEach((p, pi) => p.notes.forEach((_, ni) => posMap.push({ pi, ni })));

  let t = 0;
  song.seq.forEach(([k, beat, dur], i) => {
    const { pi, ni } = posMap[i];
    const isFirst = ni === 0;
    const isLast = dur > 1;
    const human = 1 + 0.014 * Math.sin(i * 1.7) + (isLast ? 0.05 : 0);
    const at = 300 + t;
    t += dur * spb * 1000 * human;

    demoState.timers.push(setTimeout(() => {
      if (!demoState.playing) return;
      followState.phrase = pi;
      followState.note = ni;
      renderFollow();
      const key = keyEls[k];
      key.classList.add('demo-hit');
      const freq = parseFloat(key.dataset.freq);
      playNote(freq, 'play', isFirst ? 1.2 : isLast ? 0.9 : 1.0);
      if (isFirst) playBass(freq);
      spawnRipple(key);
      demoState.timers.push(setTimeout(() => {
        if (!demoState.playing) return;
        key.classList.remove('demo-hit');
      }, Math.min(dur * spb * 0.72, 0.6) * 1000));
    }, at));
  });

  followEl.querySelector('.f-hint').textContent =
    `全曲示范 · 约 ${Math.round(t / 1000)} 秒 · 随时可停`;

  demoState.timers.push(setTimeout(() => {
    if (demoState.playing) finishMasterDemo(false);
  }, t + 300 + 300));
}

function finishMasterDemo(stopped) {
  demoState.playing = false;
  demoState.full = false;
  stopDemoTimers();
  keyEls.forEach(el => el.classList.remove('active', 'demo-hit'));
  masterBtn.textContent = '全曲示范';
  masterBtn.classList.remove('on');
  followState.active = true;
  followState.phrase = 0;
  followState.note = 0;
  renderFollow();
  followEl.querySelector('.f-hint').textContent =
    stopped ? '好，你来！亮哪儿按哪儿' : '听完了？轮到你了：亮哪儿按哪儿';
}

masterBtn.addEventListener('click', () => {
  if (demoState.full) finishMasterDemo(true);
  else startMasterDemo();
});

// 节拍开关：状态存本地，下次进来还是上次的选择
beatBtn.addEventListener('click', () => {
  beatOn = !beatOn;
  try { localStorage.setItem(BEAT_KEY, beatOn ? '1' : '0'); } catch (e) {}
  syncBeatBtn();
});
syncBeatBtn();

function renderFollow() {
  const song = SONG_MAP[followState.songId];
  const sheet = followEl.querySelector('.f-sheet');
  sheet.innerHTML = '';

  // 表头：曲名 + 进度。窗口一次只画 4 句，"弹到第几句 / 全曲共几句"就全靠这里可读，
  // 尤其全曲化之后（沧海 20 句），没有进度数字很容易失去耐心。
  followEl.querySelector('.f-song').textContent = song.title;
  const total = song.phrases.length;
  // 进度 = 当前正在弹的句子序号。句弹完 phrase 会 +1，正好指向下一句；
  // 全曲结束时 phrase 已被钳在末句，用 note 越界判断收尾为 total。
  const atEnd = songState.finished ||
    (followState.phrase === total - 1 && followState.note >= song.phrases[total - 1].notes.length);
  const cur = atEnd ? total : Math.min(followState.phrase + 1, total);
  followEl.querySelector('.f-prog').textContent = '第 ' + cur + ' / ' + total + ' 句';

  // 段落起点集合：groups = [4,4,4,...] 表示每段几句，新段第一行加 verse-start
  const verseStarts = new Set();
  if (song.groups) {
    let acc = 0;
    song.groups.forEach(g => { verseStarts.add(acc); acc += g; });
  }

  // ===== 滚动窗口：一屏只放 4 句，弹到哪滑到哪 =====
  // 前面弹完的句子退出窗口、后面的句子接续进来，视线永远聚焦在"现在和接下来"。
  // 全曲感交给表头进度「第 X / Y 句」承担，不再靠把 20 句全部铺在屏上。
  const WINDOW = 4;
  let winStart;
  if (atEnd) {
    // 全曲收尾：停在最后 4 句，整屏变暗的"弹完了"比跳回中间更自然
    winStart = Math.max(0, total - WINDOW);
  } else {
    // 当前句尽量落在窗口第 2 行：上面留 1 句已弹的作对照，下面留 2~3 句"接下来"
    winStart = Math.max(0, Math.min(followState.phrase - 1, total - WINDOW));
  }
  const winEnd = Math.min(winStart + WINDOW, total);

  // 窗口边界放一句「⋯」，表示还有内容没画出来（开头/结尾处不放）
  if (winStart > 0) {
    const more = document.createElement('div');
    more.className = 'f-more';
    more.textContent = '⋯⋯⋯';
    sheet.appendChild(more);
  }
  for (let pi = winStart; pi < winEnd; pi++) {
    const p = song.phrases[pi];
    const row = document.createElement('div');
    row.className = 'f-row';
    if (verseStarts.has(pi) && pi > 0) row.classList.add('verse-start');
    // 整句弹完（含最后一句收尾）→ 整行变暗
    if (pi < followState.phrase ||
        (pi === followState.phrase && followState.note >= p.notes.length)) {
      row.classList.add('done-row');
    }

    const ly = document.createElement('span');
    ly.className = 'r-lyric';
    ly.textContent = p.text;

    const ns = document.createElement('span');
    ns.className = 'r-notes';
    p.notes.forEach((k, i) => {
      const span = document.createElement('span');
      span.className = 'f-note';
      span.style.color = KEY_COLORS[k];
      span.innerHTML = NUM_LABELS[k] + (k === 5 ? '<sup>·</sup>' : '');
      const isPast = pi < followState.phrase || (pi === followState.phrase && i < followState.note);
      const isCur = pi === followState.phrase && i === followState.note;
      if (isPast) span.classList.add('done');
      if (isCur) span.classList.add('cur');
      ns.appendChild(span);
    });

    row.appendChild(ly);
    row.appendChild(ns);
    sheet.appendChild(row);
  }
  if (winEnd < total) {
    const more = document.createElement('div');
    more.className = 'f-more';
    more.textContent = '⋯⋯⋯';
    sheet.appendChild(more);
  }

  // 键位发光：下一个要弹的键直接在琴键上呼吸发亮。
  // 这是比简谱条更强的引导——简谱条告诉"按哪个音"，发光告诉"手放哪里"。
  // 演示播放中（followState.active = false）不发光，避免和演示按键的闪光打架。
  keyEls.forEach(el => el.classList.remove('pulse'));
  if (followState.active) {
    const p = song.phrases[followState.phrase];
    if (p && followState.note < p.notes.length) {
      keyEls[p.notes[followState.note]].classList.add('pulse');
    }
  }
}

// ===== 跟弹节拍提示 =====
// 设计成"跟着你走"的节拍器，而不是一个自顾自走的时钟：
// 你每弹对一个音，它按这个音的时值延后一拍响一声；你要是卡住不再弹，
// 它响完这一声就停，不会一直滴答催你（跟弹本来就没有时间压力）。
// 好处是它教的正是"间隔"——提示的是"下一个音该在多久之后"，
// 而不是"你落后了几拍"。后者只会让新手越急越乱。
// （状态声明在上面的 demo 区块里，那里要提前用）

/** 取消待响的那一拍，并清掉键上的短闪 */
function stopBeat() {
  clearTimeout(beatState.timer);
  clearTimeout(beatState.flashTimer);
  beatState.timer = 0;
  if (beatState.el) { beatState.el.classList.remove('beat-flash'); beatState.el = null; }
}

/**
 * 刚弹完一个音，排下一拍的提示。
 * @param {number} durBeats 刚弹完这个音的时值（拍）。句末是 2 拍，
 *                          所以句间的提示天然会隔两拍——分句的呼吸被听见了。
 */
function scheduleBeat(durBeats) {
  stopBeat();
  if (!beatOn || !followState.active) return;
  const song = SONG_MAP[followState.songId];
  if (!song) return;
  const delay = durBeats * (60 / song.bpm) * 1000;
  beatState.timer = setTimeout(() => {
    beatState.timer = 0;
    if (!beatOn || !followState.active) return;
    const p = song.phrases[followState.phrase];
    if (!p) return;
    const accent = followState.note === 0;
    playTick(accent);
    const el = keyEls[p.notes[followState.note]];
    if (!el) return;
    el.classList.remove('beat-flash');
    // 强制重排一次动画：连续两拍落在同一个键上（同一音重复）时要能重新闪
    void el.offsetWidth;
    el.classList.add('beat-flash');
    beatState.el = el;
    beatState.flashTimer = setTimeout(() => {
      el.classList.remove('beat-flash');
      if (beatState.el === el) beatState.el = null;
    }, 200);
  }, delay);
}

function syncBeatBtn() {
  beatBtn.textContent = beatOn ? '节拍 · 开' : '节拍 · 关';
  beatBtn.classList.toggle('on', beatOn);
  if (!beatOn) stopBeat();
}

function followJudge(idx) {
  if (!followState.active) return;
  const song = SONG_MAP[followState.songId];
  const p = song.phrases[followState.phrase];
  // 弹错键：不出声地等（那个键还是会发它自己的音），不前进、不提示
  if (idx !== p.notes[followState.note]) return;

  // 记下刚弹完这个音的时值：句末是 2 拍，节拍提示据此把句间的"呼吸"留出来
  const durBeats = followState.note === p.notes.length - 1 ? 2 : 1;

  followState.note++;
  if (followState.note >= p.notes.length) {
    followState.phrase++;
    followState.note = 0;
    if (followState.phrase >= song.phrases.length) {
      // 全曲完成：先把画面停在"最后一句全部弹完"的状态再收，phrase 不能越界
      followState.active = false;
      songState.finished = true;
      followState.phrase = song.phrases.length - 1;
      followState.note = song.phrases[followState.phrase].notes.length;
      renderFollow();
      setTimeout(() => { endSong(); songEndEl.classList.add('show'); }, 800);
      return;
    }
  }
  scheduleBeat(durBeats);
  renderFollow();
}

function endSong() {
  songState.active = false;
  followState.active = false;
  demoState.playing = false;
  demoState.full = false;
  stopDemoTimers();
  stopBeat();
  // 退出后这些按钮回到初始文案，否则下次进来会停在「停止」
  masterBtn.textContent = '全曲示范';
  masterBtn.classList.remove('on');
  demoBtn.textContent = '再看演示';
  cancelAnimationFrame(songState.raf);
  chartEl.classList.remove('show');
  speedEl.classList.remove('show');
  lyricEl.classList.remove('show');
  followEl.classList.remove('show');
  keyEls.forEach(el => { el.classList.remove('pulse', 'active', 'demo-hit'); });
  songBtn.textContent = '弹一首';
  songBtn.classList.remove('on');
  // 自由弹奏是"满屏琴键"的形态，横屏左栏也一并收回
  document.body.classList.remove('sheet-mode');
  pressed.clear();
}

let frameTick = 0;

function chartLoop() {
  if (!songState.active) return;
  // 尺寸自愈：旋转屏幕时 resize / orientationchange 不一定都到（iOS 地址栏收放、
  // 分屏拖拽都会漏）。每 16 帧对一次键区真实尺寸，对不上就重算——
  // 这样无论事件来不来，音符都不会和琴键错位。
  if ((frameTick++ & 15) === 0) {
    const rw = keysContainer.offsetWidth, rh = keysContainer.offsetHeight;
    if (Math.abs(rw - geom.W) > 1 || Math.abs(rh - geom.H) > 1) resizeChart();
  }
  // 不用 rAF 回调自带的时间戳：它在部分环境下（headless、虚拟时间）
  // 与 performance.now() 不同源，会让音符位置整体偏移半个屏幕。
  const elapsed = (performance.now() - songState.startTime) / 1000;
  stepSong(elapsed);
  drawChart(elapsed);
  songState.raf = requestAnimationFrame(chartLoop);
}

function stepSong(elapsed) {
  const notes = songState.notes;

  // ① 按住不放也算命中：很多零基础用户会一直按着同一个键不撒手
  if (pressed.size) {
    for (const n of notes) {
      if (n.hit) continue;
      const dt = elapsed - n.t;
      if (dt >= 0 && dt <= HOLD_WINDOW && pressed.has(n.k)) hitNote(n, elapsed);
    }
  }

  // ② 超出窗口还没命中 → 标记飘过。不弹提示、不记 miss，只是淡出
  for (const n of notes) {
    if (!n.hit && !n.missed && elapsed > n.t + hitWindow) n.missed = true;
  }

  // ③ 乐句提示，提前 0.35s 淡入
  const lys = songState.song.lyrics;
  while (songState.lyricIdx < lys.length &&
         elapsed >= lys[songState.lyricIdx].beat * songState.spb - 0.35) {
    showLyric(lys[songState.lyricIdx].text);
    songState.lyricIdx++;
  }

  // ④ 命中特效老化
  songState.fx = songState.fx.filter(f => elapsed - f.t < 0.55);

  // ⑤ 收尾
  if (!songState.finished && elapsed > songState.endT) {
    songState.finished = true;
    setTimeout(() => { endSong(); songEndEl.classList.add('show'); }, 400);
  }
}

function hitNote(n, elapsed) {
  n.hit = true;
  n.hitAt = elapsed;
  songState.fx.push({ k: n.k, t: elapsed });
}

function songJudge(keyIdx) {
  if (!songState.active || songState.finished) return;
  const elapsed = (performance.now() - songState.startTime) / 1000;
  let best = null, bestDt = Infinity;
  for (const n of songState.notes) {
    if (n.hit || n.k !== keyIdx) continue;
    const dt = Math.abs(n.t - elapsed);
    if (dt < bestDt) { bestDt = dt; best = n; }
  }
  if (best && bestDt <= hitWindow) hitNote(best, elapsed);
}

let lyricTimer = 0;
function showLyric(text) {
  lyricEl.textContent = text;
  lyricEl.classList.add('show');
  clearTimeout(lyricTimer);
  lyricTimer = setTimeout(() => lyricEl.classList.remove('show'), 3400);
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawChart(elapsed) {
  const { W, H, judgeY, keyW, speed } = geom;
  const c = cctx;
  const nKeys = PENTATONIC.length;
  c.clearRect(0, 0, W, H);

  // 每个键离"最近的一个待弹音符"还有多久，决定轨道亮度
  const near = new Array(nKeys).fill(Infinity);
  for (const n of songState.notes) {
    if (n.hit) continue;
    const d = Math.abs(n.t - elapsed);
    if (d < near[n.k]) near[n.k] = d;
  }

  // 轨道：极淡竖线，帮用户对准横向位置
  c.save();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 1;
  for (let i = 0; i < nKeys; i++) {
    c.globalAlpha = 0.05;
    c.beginPath();
    c.moveTo((i + 0.5) * keyW, 0);
    c.lineTo((i + 0.5) * keyW, judgeY);
    c.stroke();
  }
  c.restore();

  // 命中后的余晖，用来让光柱在命中瞬间不"啪"地消失
  const hitGlow = new Array(nKeys).fill(0);
  for (const f of songState.fx) {
    const age = elapsed - f.t;
    if (age >= 0 && age < 0.4) {
      hitGlow[f.k] = Math.max(hitGlow[f.k], 1 - age / 0.4);
    }
  }

  // 判定线：每键一段，音符接近时变亮变粗
  for (let i = 0; i < nKeys; i++) {
    const x = (i + 0.5) * keyW;
    const half = keyW * 0.31;
    const glow = Math.max(0, 1 - near[i] / 0.8);
    const beam = Math.max(glow, hitGlow[i] * 0.85);

    // 接近时的光柱，这是"现在按这里"最强的引导。
    // 用垂直拉长的椭圆径向渐变，水平垂直两个方向都柔和，不会像色块。
    if (beam > 0.02) {
      c.save();
      c.globalAlpha = beam * 0.5;
      c.translate(x, judgeY);
      c.scale(1, 2.4);
      const r = keyW * 0.42;
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, KEY_COLORS[i]);
      g.addColorStop(0.45, KEY_COLORS[i] + 'aa');
      g.addColorStop(1, KEY_COLORS[i] + '00');
      c.fillStyle = g;
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    c.save();
    c.globalAlpha = 0.24 + Math.max(glow, hitGlow[i]) * 0.68;
    c.strokeStyle = KEY_COLORS[i];
    c.lineWidth = 2.2 + glow * 2.5;
    c.beginPath();
    c.moveTo(x - half, judgeY);
    c.lineTo(x + half, judgeY);
    c.stroke();
    c.restore();
  }

  // 下落音符
  for (const n of songState.notes) {
    if (n.hit) continue;
    const y = judgeY - (n.t - elapsed) * speed;
    if (y < -60 || y > H + 60) continue;

    let alpha = 1;
    if (n.missed) {
      // 飘过时快速淡掉：0.36s 内消失，避免落到键标签上糊成一片
      alpha = 0.5 - (elapsed - n.t - hitWindow) * 1.4;
      if (alpha <= 0.01) continue;
    }
    drawNote(c, (n.k + 0.5) * keyW, y, keyW, KEY_COLORS[n.k], alpha);
  }

  // 命中特效：向外扩散的圆环
  for (const f of songState.fx) {
    const age = elapsed - f.t;
    const p = age / 0.55;
    if (p < 0 || p > 1) continue;
    const x = (f.k + 0.5) * keyW;
    c.save();
    c.globalAlpha = (1 - p) * 0.85;
    c.strokeStyle = KEY_COLORS[f.k];
    c.lineWidth = 3.2 * (1 - p) + 0.4;
    c.beginPath();
    c.arc(x, judgeY, 10 + p * keyW * 0.62, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }
}

function drawNote(c, x, y, keyW, color, alpha) {
  const w = keyW * 0.5;
  const h = 26;
  c.save();
  c.globalAlpha = alpha;
  c.shadowColor = color;
  c.shadowBlur = 18;
  c.fillStyle = color;
  roundRect(c, x - w / 2, y - h / 2, w, h, h / 2);
  c.fill();

  // 顶部高光，让方块有体积感
  c.shadowBlur = 0;
  c.globalAlpha = alpha * 0.5;
  c.fillStyle = '#ffffff';
  roundRect(c, x - w / 2 + 4, y - h / 2 + 4, w - 8, h * 0.3, h * 0.15);
  c.fill();
  c.restore();
}

// ========== 曲目模式接线 ==========
const speedEl = document.getElementById('speed');
const speedBtns = Array.from(speedEl.querySelectorAll('button'));

// 切换下落档位。sec 改变的是"像素/秒"，时间轴本身不动，
// 所以曲目中切档时音符会整体跳一下位置，但不会错拍。
function setFall(idx, persist = true) {
  const i = (idx >= 0 && idx < FALL_PRESETS.length) ? idx : 1;
  fallPreset = FALL_PRESETS[i];
  hitWindow = fallPreset.win;
  speedBtns.forEach((b, j) => b.classList.toggle('on', j === i));
  if (songState.active) geom.speed = geom.judgeY / fallPreset.sec;
  if (persist) { try { localStorage.setItem(FALL_KEY, fallPreset.id); } catch (e) {} }
}

speedBtns.forEach(b => b.addEventListener('click', () => setFall(Number(b.dataset.i))));

// 恢复上次选的档位：手感这东西一次调好就不该每次都重调
try {
  const saved = localStorage.getItem(FALL_KEY);
  const i = FALL_PRESETS.findIndex(p => p.id === saved);
  setFall(i >= 0 ? i : 1, false);
} catch (e) {
  setFall(1, false);
}

// ===== 曲目面板 =====
const panelEl = document.getElementById('song-panel');
const listEl = document.getElementById('song-list');

function buildPanel() {
  listEl.innerHTML = '';
  SONGS.forEach(def => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML =
      '<div class="s-main">' +
        // 单段曲目不写「1 段」（茉莉花全本一段到底，写出来反而怪）
        `<div class="s-title">${def.title}<span class="s-meta">全曲${def.groups.length > 1 ? ` ${def.groups.length} 段 ·` : ' ·'} ${def.phrases.length} 句</span></div>` +
        `<div class="s-preview">${previewOf(def)}</div>` +
      '</div>' +
      '<button class="s-fall">下落</button>';
    card.addEventListener('click', e => {
      // 整卡 = 跟弹（新手默认）；「下落」小按钮 = 瀑布流
      closePanel();
      const fallBtn = e.target.closest ? e.target.closest('.s-fall') : null;
      if (fallBtn) startSong(def.id);
      else startFollow(def.id);
    });
    listEl.appendChild(card);
  });
}

function openPanel() { buildPanel(); panelEl.classList.add('show'); }
function closePanel() { panelEl.classList.remove('show'); }
panelEl.querySelector('.panel-close').addEventListener('click', closePanel);

// 记住最近一次的曲目和模式，「再弹一次」直接照原样重来
let lastStart = { id: 'canghai', mode: 'follow' };

songBtn.addEventListener('click', () => {
  if (songState.active) { endSong(); songEndEl.classList.remove('show'); }
  else if (panelEl.classList.contains('show')) closePanel();
  else openPanel();
});

document.getElementById('again-btn').addEventListener('click', () => {
  songEndEl.classList.remove('show');
  if (lastStart.mode === 'follow') startFollow(lastStart.id);
  else startSong(lastStart.id);
});
document.getElementById('quit-btn').addEventListener('click', () => {
  songEndEl.classList.remove('show');
});

// 尺寸变化后重算谱面。必须延后一拍：resize 事件常在布局还没落定时就触发，
// 那时 getBoundingClientRect 还是旧值，画布会按旧宽高画、和琴键错位。
let chartResizeTimer = 0;
function scheduleChartResize(delay) {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => { if (songState.active) resizeChart(); }, delay);
}
window.addEventListener('resize', () => scheduleChartResize(80));
// 手机旋转：iOS 的地址栏收放会让尺寸连跳几次，给长一点的延迟再补一次
window.addEventListener('orientationchange', () => scheduleChartResize(260));

/* ===== 音频自愈 =====
   浏览器的自动播放策略会随时把 AudioContext 挂成 suspended（页面切后台再回来、
   系统来电、省电模式、桌面端"阻止自动播放"开关）。它一旦挂着，currentTime 就冻在
   原地，页面彻底静音 —— 而且不会有任何报错。这里在每一次用户手势里顺手恢复：
   用户点任何地方，下一声响就该回来。 */
['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(type => {
  window.addEventListener(type, () => {
    if (ctx && ctx.state === 'suspended') unlockAudio();
  }, { passive: true, capture: true });
});
// 切回前台也恢复一次（手机锁屏、切微信再回来最常见的静音原因）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) unlockAudio();
});

/* ===== 横屏布局开关 =====
   真横屏（系统转过来了）和手动横屏（整屏旋转）共用 body.land 这一套规则：
   - 真横屏 → 加 body.land
   - 竖屏点「横屏」→ 加 body.land + html.rot（把舞台转 90°）
   为什么不直接用 @media (orientation: landscape)：媒体查询只认系统给的真实视口，
   手机一开「竖屏锁定」就永远不命中；而 screen.orientation.lock 只在 Android 全屏下
   有效、iOS 完全不支持，网页根本没有强制转屏的权限。所以只能自己转。 */
const rotBtn = document.getElementById('rot-toggle');
const mqLand = window.matchMedia
  ? window.matchMedia('(orientation: landscape)')
  : { matches: false, addEventListener: null, addListener: null };
let forceLand = false;

function applyLayoutMode() {
  const realLand = !!mqLand.matches;
  const land = realLand || forceLand;
  document.body.classList.toggle('land', land);
  // 只有"竖屏 + 用户要求横屏"才需要真的旋转；系统已经是横屏时再转就转两次了
  const root = document.documentElement;
  if (root && root.classList) root.classList.toggle('rot', forceLand && !realLand);
  if (rotBtn) {
    // 系统已经横过来时这个按钮没有意义，收起来；否则按当前状态给文案
    rotBtn.style.display = realLand ? 'none' : '';
    rotBtn.textContent = (forceLand && !realLand) ? '竖屏' : '横屏';
  }
  scheduleChartResize(60);
}

if (rotBtn) rotBtn.addEventListener('click', () => {
  forceLand = !forceLand;
  applyLayoutMode();
});
if (mqLand.addEventListener) mqLand.addEventListener('change', applyLayoutMode);
else if (mqLand.addListener) mqLand.addListener(applyLayoutMode);  // 老 Safari 只认 addListener
applyLayoutMode();

/* ===== 全屏开关 =====
   手机上那排地址栏和底部工具栏，CSS 去不掉，只能走 Fullscreen API。
   各平台支持差别很大，所以这里只承诺"能全屏就真全屏，不能就告诉用户怎么绕"：
   - Android Chrome / 微信（X5 内核）：支持，调用即真全屏
   - iPhone Safari：不支持对普通网页全屏（只有 <video> 可以），点了会失败
     → 弹一条说明，指路「分享 → 添加到主屏幕」，从桌面图标启动就是无地址栏全屏
   - iPad Safari 16.4+：支持
   状态一律以 fullscreenchange 事件为准，不在点击时自己猜——
   用户按 ESC、安卓返回手势、微信返回键都能退全屏，按钮文案必须跟着回来。 */
const fsBtn = document.getElementById('fs-toggle');

function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement ||
         document.msFullscreenElement || null;
}

function syncFsBtn() {
  if (!fsBtn) return;
  const on = !!fsElement();
  fsBtn.textContent = on ? '退出全屏' : '全屏';
  fsBtn.classList.toggle('on', on);
  scheduleChartResize(80);   // 全屏后视口尺寸变了，瀑布流画布要重算
}

function showFsHint(msg) {
  let t = document.getElementById('fs-hint');
  if (!t) {
    t = document.createElement('div');
    t.id = 'fs-hint';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showFsHint.timer);
  showFsHint.timer = setTimeout(() => t.classList.remove('show'), 4600);
}

async function enterFullscreen(silent) {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) {
    if (!silent) showFsHint('这台浏览器不支持网页全屏。iPhone 请点下方「分享」→「添加到主屏幕」，从桌面图标打开就没有地址栏了');
    return false;
  }
  try {
    await req.call(el, { navigationUI: 'hide' });
    syncFsBtn();
    return true;
  } catch (e) {
    if (!silent) showFsHint('全屏被拦住了。微信里点右上角「⋯」→「在浏览器打开」再试；iPhone 的 Safari 不支持网页全屏，请点「分享」→「添加到主屏幕」，从桌面图标打开');
    return false;
  }
}

async function exitFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  try { if (exit) await exit.call(document); } catch (e) { /* 可能已经退出了 */ }
  syncFsBtn();
}

if (fsBtn) fsBtn.addEventListener('click', () => {
  if (fsElement()) exitFullscreen(); else enterFullscreen(false);
});

// ESC / 返回手势 / 系统收起全屏，都走这个事件同步按钮
if (document.addEventListener) {
  ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
    document.addEventListener(ev, syncFsBtn);
  });
}
syncFsBtn();

// ========== 启动入口 ==========
function showTip() {
  const tip = document.getElementById('tip');
  if (!tip) return;
  tip.classList.add('show');
  setTimeout(() => tip.classList.remove('show'), 5200);
}

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('overlay').classList.add('hidden');
  showTip();
  // 点「开始」这一下本来就在用户手势里，顺手进全屏。
  // 静默失败：不支持的机型别用弹窗打断，用户想弄清原因自己点右上角「全屏」。
  enterFullscreen(true);
});
</script>
